name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Construit dans une Ubuntu 22.04 : un binaire lié à une glibc récente
          # refuse de démarrer sur une distribution plus ancienne.
          - { name: Linux, os: ubuntu-latest, container: 'ubuntu:22.04', artifact: TransfertPhoto-linux-x86_64 }
          - { name: Windows, os: windows-latest, artifact: TransfertPhoto-windows-x86_64 }
          - { name: macOS, os: macos-latest, artifact: TransfertPhoto-macos-universal }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Le CMake d'Ubuntu 22.04 (3.22) est trop ancien pour le projet ; git sert
      # à FetchContent pour récupérer Catch2.
      - name: Installer les outils et GTK 3
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git libgtk-3-dev python3-pip
          pip3 install 'cmake>=3.28,<4'

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Un nombre explicite : avec make, --parallel seul lance un nombre de
      # tâches illimité, qui épuise la mémoire de la machine.
      - name: Construire
        run: cmake --build build --config Release --parallel 4

      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure

      # Chaque étape affiche aussi ce à quoi le binaire est lié, pour qu'une
      # nouvelle dépendance à l'exécution se voie dans le journal.
      - name: Empaqueter (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd build/bin/TransfertPhoto
          glibc=$(objdump -T build/bin/TransfertPhoto | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc requise : $glibc"
          if [ "$(printf '%s\n' GLIBC_2.35 "$glibc" | sort -V | tail -1)" != GLIBC_2.35 ]; then
            echo "::error::le binaire exige $glibc, au-delà de la glibc 2.35 visée"
            exit 1
          fi
          mkdir dist
          tar -C build/bin -czf dist/${{ matrix.artifact }}.tar.gz TransfertPhoto

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        run: |
          ldd build/bin/Release/TransfertPhoto.exe || true
          mkdir dist
          cp build/bin/Release/TransfertPhoto.exe dist/

      - name: Empaqueter (macOS)
        if: runner.os == 'macOS'
        run: |
          lipo -archs build/bin/TransfertPhoto.app/Contents/MacOS/TransfertPhoto
          otool -L build/bin/TransfertPhoto.app/Contents/MacOS/TransfertPhoto
          mkdir dist
          ditto -c -k --keepParent build/bin/TransfertPhoto.app dist/${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
