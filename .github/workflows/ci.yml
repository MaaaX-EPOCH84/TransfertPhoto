name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, artifact: TransfertPhoto-linux-x86_64 }
          - { name: Windows, os: windows-latest, artifact: TransfertPhoto-windows-x86_64 }
          - { name: macOS, os: macos-latest, artifact: TransfertPhoto-macos-universal }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Installer GTK 3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Construire
        run: cmake --build build --config Release --parallel

      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure

      # Chaque étape affiche aussi ce à quoi le binaire est lié, pour qu'une
      # nouvelle dépendance à l'exécution se voie dans le journal.
      - name: Empaqueter (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd build/bin/TransfertPhoto
          mkdir dist
          tar -C build/bin -czf dist/${{ matrix.artifact }}.tar.gz TransfertPhoto

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        run: |
          ldd build/bin/Release/TransfertPhoto.exe || true
          mkdir dist
          cp build/bin/Release/TransfertPhoto.exe dist/

      - name: Empaqueter (macOS)
        if: runner.os == 'macOS'
        run: |
          lipo -archs build/bin/TransfertPhoto.app/Contents/MacOS/TransfertPhoto
          otool -L build/bin/TransfertPhoto.app/Contents/MacOS/TransfertPhoto
          mkdir dist
          ditto -c -k --keepParent build/bin/TransfertPhoto.app dist/${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
